[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-casebook"
version = "0.1.0"
description = "AI does first-pass alert triage, a human makes the call, and every alert ends in a written case file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Edward Griggs" }]
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
casebook = "casebook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/casebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["casebook", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
